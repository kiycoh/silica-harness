<text x="232" y="191" font-size="11.5" fill="#969CA6" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">concept graph, BM25, no model</text>
<circle r="3.5" fill="#22B4CC" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0667;0.0917;0.1833;0.2083;1.0000" dur="12.0s" repeatCount="indefinite"/><animateMotion path="M160 174 C 188 174, 188 178, 206 178" calcMode="linear" rotate="0" keyPoints="0;0;1;1" keyTimes="0.0000;0.0750;0.1500;1.0000" dur="12.0s" repeatCount="indefinite"/></circle>

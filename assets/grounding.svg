<rect x="0.5" y="0.5" width="879" height="329" fill="none" stroke="#2F343A"/>
<text x="28" y="36" font-size="17" fill="#F4F5F7" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="start">One question, three legs, fused by rank</text>
<rect x="28" y="48" width="42" height="3" rx="1.5" fill="#22B4CC"/>
<rect x="28" y="152" width="132" height="44" rx="0" fill="#1B1E21" stroke="#2F343A" stroke-width="1"/>

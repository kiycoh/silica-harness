<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="A question runs down three independent legs. Two return ranked notes, the opt-in lexical leg abstains, and what comes back is fused by rank." font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>How an answer is grounded</title>
<desc>The question reaches the embeddings leg, the co-occurrence leg and the opt-in lexical leg. The lexical leg abstains. The other two return their own rankings, which fuse by rank, so a note both legs found outranks a note only one of them found.</desc>

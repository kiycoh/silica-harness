<text x="382" y="216" font-size="13" fill="#969CA6" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">links resolve</text>
<rect x="680" y="96" width="172" height="148" rx="0" fill="#1B1E21" stroke="#2F343A" stroke-width="1"/>
<text x="700" y="124" font-size="13" fill="#969CA6" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">the note</text>
<rect x="700" y="146" width="132" height="6" rx="3" fill="#2F343A"/>
<rect x="700" y="162" width="110" height="6" rx="3" fill="#2F343A"/>

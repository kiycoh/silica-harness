<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="An edit proposed by the model is checked by the gate, lands in the note and is read back. A second edit fails the structural check and is sent back, leaving the note untouched." font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>How a write reaches the vault</title>
<desc>Two passes. The first edit passes parse, structure and links, lands as a new line, and a pulse travels back from the note to the gate to read it after it landed. The second edit fails the structure check, returns to the model, and the note is unchanged.</desc>
<rect width="880" height="330" fill="#0D0E0F"/>
<rect x="0.5" y="0.5" width="879" height="329" fill="none" stroke="#2F343A"/>
<text x="28" y="36" font-size="17" fill="#F4F5F7" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="start">Nothing lands unparsed, and what lands is read back</text>
<rect x="28" y="48" width="42" height="3" rx="1.5" fill="#22B4CC"/>
<rect x="28" y="116" width="140" height="108" rx="0" fill="#1B1E21" stroke="#2F343A" stroke-width="1"/>
<circle cx="48" cy="146" r="3.5" fill="#9C80E5"/>

<text x="48" y="178" font-size="13" fill="#C5CAD2" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">proposes</text>
<text x="48" y="202" font-size="11.5" fill="#969CA6" font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start">write_note()</text>
<rect x="336" y="104" width="176" height="132" rx="0" fill="#1B1E21" stroke="#2F343A" stroke-width="1"/>
<text x="358" y="132" font-size="12" fill="#969CA6" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">the gate, one way in</text>
<circle cx="364" cy="160" r="6" fill="none" stroke="#2F343A"/>
<text x="382" y="164" font-size="13" fill="#969CA6" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">parse</text>
<circle cx="364" cy="186" r="6" fill="none" stroke="#2F343A"/>
<text x="382" y="190" font-size="13" fill="#969CA6" font-family="Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">structure</text>

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "silica/_version.py"

[project]
name = "silica-harness"
dynamic = ["version"]
description = "Obsidian-native agentic CLI — vault curation with quality gates"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Alessandro Carosia" }]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
]
dependencies = [
  "litellm",
  "httpx",
  "pydantic>=2.0",
  "prompt_toolkit>=3.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich",
  "networkx>=3",
  # [linkify] pulls linkify-it-py: bare URLs in an answer become link tokens
  # before the note-ref pass sees them, in the web render and the TUI alike.
  "markdown-it-py[linkify]",
  "orjson",
  "openai",
  "numpy>=2.4.6",
  "snowballstemmer",
  "stop-words>=2025.11.4",
  "tree-sitter>=0.25",
  # up to 1.8.x the pack shipped its own binding (method-style nodes, parse_bytes);
  # newer ones hand back upstream py-tree-sitter objects, which is what codeast
  # speaks. Unpinned, the mismatch parsed nothing and every code note came out empty.
  "tree-sitter-language-pack>=1.13",
  "yake>=0.7.3",
  # Default document→Markdown converter (PDF/DOCX/EPUB/XPS/MOBI/FB2). 3 packages,
  # ~60 MB, no torch and no JVM, so it can live in the base install where mineru
  # (3.8 GB of torch+CUDA) cannot. Capped below 1.0: from 1.27.2 it hard-depends
  # on pymupdf-layout, which is Polyform Noncommercial and would put a
  # non-commercial restriction on an AGPL package. The cap costs borderless-table
  # detection; lift it only if silica ever stops being distributed.
  "pymupdf4llm>=0.3.4,<1",
  # Legacy office without an office suite. Both are pure python, tiny and
  # permissive (BSD): striprtf 15 KB reads .rtf, xlrd 192 KB reads pre-2007
  # .xls (2.x dropped .xlsx and kept exactly the format nothing else opens).
  # ODF needs neither -- it is a ZIP the standard library reads. Together they
  # replace a ~240 MB LibreOffice install for 5 of the 7 legacy formats.
  "striprtf>=0.0.29",
  "xlrd>=2.0",
  "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
# Opt-in localhost web GUI (`silica --gui`); python-multipart backs the drop-zone
# upload, mdit-py-plugins + latex2mathml render math in the transcript. All four
# are imported only by silica.ui.web.server, which is reachable only behind the
# lazy `from silica.ui.web import serve`:
gui = ["fastapi", "uvicorn", "python-multipart", "mdit-py-plugins>=0.6.1", "latex2mathml>=3.81.0"]
# scipy is dev-only: no product code imports it (PageRank runs on numpy), but the
# eval harness under evals/ uses scipy.stats (binomtest, spearmanr) for its gates.
dev = ["pytest>=8.0", "mypy>=1.10", "import-linter>=2.0", "scipy>=1.17.1"]
connect = [
    "websockets>=16.0",
]
# Opt-in stdio MCP server (`silica mcp`) — Silica as vault memory for MCP clients:
# SDK 2.0 (protocol 2026-07-28) drops the @server.list_tools/@server.call_tool
# decorators for constructor handlers, so silica/ui/mcp.py needs a rewrite before
# the cap lifts. 1.x still negotiates fine with 2026-07-28 clients.
mcp = ["mcp>=1.0,<2"]
# Opt-in in-process cross-encoder rerank (the precision pass over fused recall).
# Neither LM Studio nor Ollama can serve a cross-encoder, so the alternative is a
# llama-server the user runs by hand; this extra removes that. Pulls torch, and
# downloads ~2GB of weights on first rerank, so it stays opt-in like [pdf].
# SILICA_RERANK_BASE_URL still overrides it with a served endpoint.
rerank = ["sentence-transformers>=3.0"]
# mineru is the OCR provider: the default (pymupdf4llm, a base dependency) reads
# text layers only, so a scanned document needs this extra. It pulls
# torch/transformers and downloads models on first run — 3.8 GB against the
# default's 60 MB — which is why it is opt-in (`pip install silica-harness[pdf]`).
# The [pipeline] extra matches the CLI's `-b pipeline` backend. docling /
# opendataloader are installed manually if chosen. See SILICA_PDF_PROVIDER.
pdf = [
    "mineru[pipeline]>=3.4.4",
    # mineru 3.4.4 packaging bug: its vendored pytorchocr imports `six`
    # (pytorchocr/data/imaug/operators.py) without declaring it, so every
    # pipeline convert dies with ModuleNotFoundError. Drop when upstream fixes.
    "six",
]
# Everything except [dev]. Self-referential extra: pip resolves it back to this
# same project. Note it inherits [pdf] and [rerank], so it pulls torch and
# downloads several GB of weights on first use.
all = ["silica-harness[gui,connect,mcp,rerank,pdf]"]
# Opt-in tabular lane (`silica_query_table`) — SQL over a .csv/.parquet the user
# points at. One wheel, ~20 MB, no server and no ETL, imported only inside the
# tool body so the base install never pays for it. Kept out of [all] until the
# lane has an accuracy gate: a wrong number reads as authoritative, so shipping
# it by default would be worse than not shipping it.
bi = [
    "duckdb>=1.5.5",
    # .xlsx/.xlsm sheets for silica_query_table: read in-process (values only)
    # because DuckDB's own `excel` extension needs INSTALL, which the tool's
    # sandbox blocks by design. `.xls` rides on xlrd, already a base dep.
    "openpyxl>=3.1",
]

[project.scripts]
silica = "silica.cli:main"

[project.urls]
Homepage = "https://github.com/kiycoh/silica-harness"
Repository = "https://github.com/kiycoh/silica-harness"
Issues = "https://github.com/kiycoh/silica-harness/issues"

[tool.setuptools]
# Ship every git-tracked non-.py asset under the package (prompts, recipes,
# overlays, web static, .env.example). Beats per-package data globs:
# capabilities/prompts/** sits under the silica.capabilities package while
# recipes/ and overlays/ are non-package subdirs of silica — include-package-data
# attributes each file to its nearest package automatically, and new asset dirs
# ship for free. Without this a wheel install drops them and crashes at runtime.
include-package-data = true

[tool.setuptools.packages.find]
include = ["silica", "silica.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["silica"]
# Required so the "graph data stays offline" contract can forbid the external
# `httpx` module (see that contract below).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "capabilities (procedural memory) does not import the decision cycle"
type = "forbidden"
source_modules = ["silica.capabilities"]
forbidden_modules = ["silica.router"]
# Direct imports only: the transitive path via agent.commit -> tools.composed
# -> tools.runners -> router predates this contract and is a separate finding.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "capabilities internals are private — consumers go through the package root"
type = "forbidden"
source_modules = [
  "silica.agent",
  "silica.router",
  "silica.tools",
  "silica.kernel",
  "silica.driver",
  "silica.sources",
  "silica.ui",
  "silica.onboarding",
  "silica.cli",
  "silica.config",
]
forbidden_modules = [
  "silica.capabilities._base",
  "silica.capabilities.dedup",
  "silica.capabilities.enrich",
  "silica.capabilities.orphan",
  "silica.capabilities.refine",
  "silica.capabilities.profile",
  "silica.capabilities.profiles_builtin",
  "silica.capabilities.runtime",
]
# Direct imports only: reaching internals through the package root is the
# sanctioned path (the root re-exports the seam).
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "kernel is the lowest layer under the seam — never imports the decision cycle"
type = "forbidden"
source_modules = ["silica.kernel"]
forbidden_modules = ["silica.router", "silica.capabilities"]
# This is the invariant that keeps workqueue/progress legal homes in kernel
# (capabilities -> kernel.workqueue must never become a cycle). Note: kernel
# is NOT pure — lazy imports into agent/ and tools/ exist (see ADR-0016 and
# the AUDIT-COALA WATCH list); this contract codifies only what is true today.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "capability workers are peers — they never import each other (P9)"
type = "independence"
modules = [
  "silica.capabilities.dedup",
  "silica.capabilities.enrich",
  "silica.capabilities.orphan",
  "silica.capabilities.refine",
]
# profile/runtime/_base sono infrastruttura condivisa, non peer: fuori lista.
ignore_imports = [
  # il control shell (subagent runner) importa il registry dei worker per
  # dispatciarli: e' l'attivazione decisa dal coordinator (P9), non un peer import.
  "silica.agent.subagent -> silica.capabilities",
]
# Residuo: catene instradate attraverso questo arco ignorato (subagent ->
# capabilities) sono invisibili a questo contratto — copre solo import diretti
# e peer import fuori dalla rotta di dispatch.

[[tool.importlinter.contracts]]
name = "graph structure is deterministic — structural modules never import agent (P2/DKB)"
type = "forbidden"
source_modules = [
  "silica.kernel.recall.cooccurrence",
  "silica.kernel.text.keyphrase",
  "silica.kernel.link.ast",
  "silica.kernel.graph_diff",
  "silica.kernel.link.autolink",
  "silica.kernel.report.graph_report.compute",
  "silica.kernel.report.graph_report.cooccur_delta",
  "silica.kernel.report.graph_report.models",
  "silica.kernel.report.graph_report.render",
  "silica.kernel.report.graph_report.code_signals",
  "silica.kernel.code.codegraph",
  # embed_signals reads stored vectors only; it stopped constructing an embedder
  # (the call was an availability probe whose result was never used), so it no
  # longer reaches silica.agent and the exemption it used to need is gone.
  "silica.kernel.report.graph_report.embed_signals",
]
forbidden_modules = ["silica.agent"]
# run_substrate is NOT listed: it imports get_embedder, a legitimate embedding
# overlay. classify/prep_delegation call an LLM but do not build graph
# structure, so they are out of scope for this contract.

[[tool.importlinter.contracts]]
name = "structural is not semantic — codegraph never enters the fusion legs"
type = "forbidden"
source_modules = ["silica.kernel.recall.relatedness", "silica.kernel.recall.rerank"]
forbidden_modules = ["silica.kernel.code.codegraph"]
# Import edges are mechanical dependency, not semantic proximity: an import
# hub (paths.py) would flood related_notes/RRF with structurally-adjacent,
# semantically-empty neighbors (spec-code-lane, Principio ordinatore).

[[tool.importlinter.contracts]]
name = "the /organize lane is a leaf — no kernel lane depends on the classifier"
type = "forbidden"
source_modules = [
  "silica.kernel.write", "silica.kernel.recall", "silica.kernel.code",
  "silica.kernel.report", "silica.kernel.text", "silica.kernel.link",
]
forbidden_modules = ["silica.kernel.organize"]
# taxonomy + classify serve one user-facing command (/organize) and nothing
# else. Keeping the arrow one-way is what lets the pair stay a two-file lane
# instead of dissolving back into text/ and recall/.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "text and code lanes sit low — they reach only recall and write"
type = "forbidden"
source_modules = ["silica.kernel.text", "silica.kernel.code"]
forbidden_modules = [
  "silica.kernel.report", "silica.kernel.link", "silica.kernel.organize",
]
# The seven lanes are mutually recursive (136 cycles between them), so there is
# no layering to declare here. These two arrows are the exception that is
# actually true, and freezing them keeps the two most reusable lanes from
# acquiring dependencies on the vault-shaped ones.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "graph data stays offline — the kernel viewer split leaves no network dep"
type = "forbidden"
source_modules = ["silica.kernel.recall.graph_export"]
forbidden_modules = ["httpx"]
# The viewer (render_html/export_graph) moved to silica.ui.web.graph_view and
# now inlines a *vendored* JS bundle; the CDN fetch (httpx) is gone. This freezes
# that: the deterministic data module must never re-acquire a network dependency.

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "yaml", "yaml.*", "networkx", "networkx.*",
    # PDF providers (mineru via the [pdf] extra; docling/opendataloader manual):
    "docling.*", "docling_core.*", "opendataloader_pdf", "pymupdf4llm",
    # Legacy office readers: both ship no stubs (xlrd has been feature-frozen
    # since 2.0 dropped .xlsx, which is exactly why it is safe to depend on).
    "xlrd", "striprtf.*",
    # No stubs and no py.typed: the NLP trio (stop-words, snowballstemmer, yake)
    # plus three that DO have stub packages on PyPI — types-python-dateutil,
    # types-Pygments, types-openpyxl. Listed here rather than installed because
    # each is reached from one narrow call site; add the stub package instead if
    # any of these three ever grows a real surface.
    "stop_words", "snowballstemmer", "yake",
    "dateutil.*", "pygments", "pygments.*", "openpyxl", "openpyxl.*",
]
ignore_missing_imports = true
